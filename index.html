<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0b12; color: #d8d8e4;
    font: 14px/1.4 system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px;
    background: #14141f; border-bottom: 1px solid #262636; }
  h1 { font-size: 16px; margin: 0 8px 0 0; letter-spacing: .5px; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  button { font: inherit; color: inherit; background: #1f1f2e; border: 1px solid #33334a;
    border-radius: 6px; padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  button:hover { background: #29293c; }
  button.active { border-color: #e8c062; background: #2e2a1f; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; }
  kbd { font-size: 11px; opacity: .55; }
  label { display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 100px; }
  .spacer { flex: 1; }
  #stats { opacity: .6; font-variant-numeric: tabular-nums; }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated;
    touch-action: none; cursor: crosshair; }
  footer { padding: 6px 12px; font-size: 12px; opacity: .55; background: #14141f; border-top: 1px solid #262636; }
</style>
</head>
<body>
<header>
  <h1>Sandbox</h1>
  <div class="group" id="palette"></div>
  <label>Brush <input type="range" id="brush" min="0" max="20" value="4"><span id="brushVal">4</span></label>
  <div class="group">
    <button id="pause">Pause <kbd>P</kbd></button>
    <button id="clear">Clear <kbd>C</kbd></button>
  </div>
  <div class="spacer"></div>
  <div id="stats"></div>
</header>
<main><canvas id="canvas"></canvas></main>
<footer>Left-drag to pour · right-drag to erase · scroll to resize brush · keys 1–6 pick a material · fire spreads through wood; water puts it out</footer>

<script>
'use strict';

const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3, WOOD = 4, FIRE = 5, EMBER = 6;
const WALL = 255; // anything outside the grid

const MATERIALS = {
  [SAND]:  { name: 'Sand',  rgb: [222, 184, 98],  vary: 28 },
  [WATER]: { name: 'Water', rgb: [48, 118, 222],  vary: 18 },
  [STONE]: { name: 'Stone', rgb: [118, 118, 130], vary: 18 },
  [WOOD]:  { name: 'Wood',  rgb: [118, 76, 40],   vary: 14 },
  [FIRE]:  { name: 'Fire',  rgb: [255, 140, 30],  vary: 50 },
  [EMBER]: { name: 'Ember', rgb: [200, 60, 20],   vary: 40 },
};
const PALETTE = [SAND, WATER, STONE, WOOD, FIRE, EMPTY]; // keys 1-6
const BG = [14, 14, 22];
const CELL_PX = 4; // screen pixels per grid cell
const MAX_BRUSH = 20;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let image, pixels; // ImageData and its Uint32 view

let W = 0, H = 0;
let cell, shade, life, stamp;
let tick = 1;

let cursorX = -1, cursorY = -1; // -1 = pointer not over the canvas
let brush = 4;
let selected = SAND;
let pointerButton = -1; // 0 = left (paint), 2 = right (erase)
let paused = false;

const rand = n => Math.floor(Math.random() * n);
const chance = p => Math.random() < p;
const clamp = (v, lo = 0, hi = 255) => (v < lo ? lo : v > hi ? hi : v);
// ImageData is RGBA bytes; as little-endian uint32 that's 0xAABBGGRR
const rgba = (r, g, b) => (255 << 24 | clamp(b) << 16 | clamp(g) << 8 | clamp(r)) >>> 0;

// ---------- grid ----------

function resize() {
  const rect = canvas.getBoundingClientRect();
  const newW = Math.max(10, Math.floor(rect.width / CELL_PX));
  const newH = Math.max(10, Math.floor(rect.height / CELL_PX));
  if (newW === W && newH === H) return;
  const nCell = new Uint8Array(newW * newH);
  const nShade = new Int8Array(newW * newH);
  const nLife = new Uint8Array(newW * newH);

  if (cell) {
    // keep existing particles, anchored to the floor
    for (let k = 0; k < Math.min(H, newH); k++) {
      const sy = H - 1 - k, dy = newH - 1 - k;
      for (let x = 0; x < Math.min(W, newW); x++) {
        const s = sy * W + x, d = dy * newW + x;
        nCell[d] = cell[s]; nShade[d] = shade[s]; nLife[d] = life[s];
      }
    }
  }

  W = newW; H = newH;
  cell = nCell; shade = nShade; life = nLife; stamp = new Uint8Array(W * H);
  canvas.width = W; canvas.height = H;
  image = ctx.createImageData(W, H);
  pixels = new Uint32Array(image.data.buffer);
}

function at(x, y) {
  return x < 0 || x >= W || y < 0 || y >= H ? WALL : cell[y * W + x];
}

function set(i, type) {
  cell[i] = type;
  const vary = type === EMPTY ? 0 : MATERIALS[type].vary;
  shade[i] = vary ? rand(2 * vary + 1) - vary : 0;
  life[i] = type === FIRE ? 20 + rand(30) : type === EMBER ? 60 + rand(80) : 0;
  stamp[i] = tick;
}

function swap(a, b) {
  let t = cell[a]; cell[a] = cell[b]; cell[b] = t;
  t = shade[a]; shade[a] = shade[b]; shade[b] = t;
  t = life[a]; life[a] = life[b]; life[b] = t;
  stamp[a] = stamp[b] = tick;
}

const isEmpty = t => t === EMPTY;
const canSink = t => t === EMPTY || (t === WATER && chance(0.6));

function moveIf(i, x, y, test) {
  if (!test(at(x, y))) return false;
  swap(i, y * W + x);
  return true;
}

function touches(x, y, type) {
  return at(x, y - 1) === type || at(x, y + 1) === type ||
         at(x - 1, y) === type || at(x + 1, y) === type;
}

function igniteAround(x, y, p) {
  for (const [nx, ny] of [[x, y - 1], [x, y + 1], [x - 1, y], [x + 1, y]]) {
    if (at(nx, ny) === WOOD && chance(p)) set(ny * W + nx, EMBER);
  }
}

// ---------- physics ----------

function updateSand(x, y, i) {
  if (moveIf(i, x, y + 1, canSink)) return;
  const d = chance(0.5) ? 1 : -1;
  moveIf(i, x + d, y + 1, canSink) || moveIf(i, x - d, y + 1, canSink);
}

function updateWater(x, y, i) {
  if (moveIf(i, x, y + 1, isEmpty)) return;
  const d = chance(0.5) ? 1 : -1;
  if (moveIf(i, x + d, y + 1, isEmpty) || moveIf(i, x - d, y + 1, isEmpty)) return;
  // flow sideways up to 3 cells so puddles level out quickly
  for (const s of [d, -d]) {
    let n = 0;
    while (n < 3 && at(x + s * (n + 1), y) === EMPTY) n++;
    if (n) { swap(i, y * W + x + s * n); return; }
  }
}

function updateFire(x, y, i) {
  if (--life[i] === 0 || touches(x, y, WATER)) { set(i, EMPTY); return; }
  igniteAround(x, y, 0.08);
  shade[i] = rand(101) - 50; // flicker
  if (chance(0.7)) moveIf(i, x + rand(3) - 1, y - 1, isEmpty);
}

function updateEmber(x, y, i) {
  if (touches(x, y, WATER)) { set(i, WOOD); return; } // doused
  if (--life[i] === 0) { set(i, EMPTY); return; }      // burnt away
  igniteAround(x, y, 0.03);
  shade[i] = rand(81) - 40;
  if (at(x, y - 1) === EMPTY && chance(0.3)) set((y - 1) * W + x, FIRE);
}

function step() {
  tick = tick === 255 ? 1 : tick + 1;
  for (let y = H - 1; y >= 0; y--) {
    const ltr = chance(0.5); // alternate scan direction to avoid drift
    for (let k = 0; k < W; k++) {
      const x = ltr ? k : W - 1 - k;
      const i = y * W + x;
      if (stamp[i] === tick) continue;
      switch (cell[i]) {
        case SAND: updateSand(x, y, i); break;
        case WATER: updateWater(x, y, i); break;
        case FIRE: updateFire(x, y, i); break;
        case EMBER: updateEmber(x, y, i); break;
      }
    }
  }
}

function paint(cx, cy, type) {
  const r2 = brush * brush;
  for (let dy = -brush; dy <= brush; dy++) {
    for (let dx = -brush; dx <= brush; dx++) {
      if (dx * dx + dy * dy > r2) continue;
      const x = cx + dx, y = cy + dy;
      if (x < 0 || x >= W || y < 0 || y >= H) continue;
      const i = y * W + x;
      if (type === EMPTY) { set(i, EMPTY); continue; }
      if (cell[i] !== EMPTY) continue;
      const grainy = type === SAND || type === WATER || type === FIRE;
      if (grainy && !chance(0.35)) continue;
      set(i, type);
    }
  }
}

function clearAll() {
  cell.fill(0); shade.fill(0); life.fill(0);
}

function seed() {
  const fill = (x0, x1, y0, y1, type) => {
    for (let y = Math.floor(y0); y <= y1; y++)
      for (let x = Math.floor(x0); x <= x1; x++)
        if (x >= 0 && x < W && y >= 0 && y < H) set(y * W + x, type);
  };
  fill(W * 0.12, W * 0.42, H * 0.35, H * 0.35 + 2, STONE);
  fill(W * 0.55, W * 0.88, H * 0.62, H * 0.62 + 2, STONE);
  fill(W * 0.62, W * 0.76, H * 0.62 - 16, H * 0.62 - 1, WOOD);
}

// ---------- rendering ----------

function render() {
  const r2 = brush * brush;
  let count = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      const t = cell[i], v = shade[i];
      let r, g, b;
      if (t === EMPTY) [r, g, b] = BG;
      else {
        count++;
        if (t === FIRE) { r = 255; g = 80 + life[i] * 4 + v; b = v; }
        else if (t === EMBER) { r = 200 + v; g = 60 + v / 2; b = 20; }
        else { const m = MATERIALS[t].rgb; r = m[0] + v; g = m[1] + v; b = m[2] + v; }
      }
      // highlight the brush footprint
      if (cursorX >= 0) {
        const dx = x - cursorX, dy = y - cursorY;
        if (dx * dx + dy * dy <= r2) {
          r += (255 - r) * 0.18; g += (255 - g) * 0.18; b += (255 - b) * 0.18;
        }
      }
      pixels[i] = rgba(r, g, b);
    }
  }
  ctx.putImageData(image, 0, 0);
  return count;
}

// ---------- UI ----------

const paletteEl = document.getElementById('palette');
const brushEl = document.getElementById('brush');
const brushValEl = document.getElementById('brushVal');
const pauseEl = document.getElementById('pause');
const statsEl = document.getElementById('stats');

const paletteButtons = PALETTE.map((t, k) => {
  const btn = document.createElement('button');
  const color = t === EMPTY ? 'transparent' : `rgb(${MATERIALS[t].rgb})`;
  const border = t === EMPTY ? 'border: 1px dashed #888;' : '';
  btn.innerHTML = `<span class="swatch" style="background:${color};${border}"></span>` +
                  `${t === EMPTY ? 'Eraser' : MATERIALS[t].name} <kbd>${k + 1}</kbd>`;
  btn.onclick = () => select(t);
  paletteEl.appendChild(btn);
  return btn;
});

function select(t) {
  selected = t;
  paletteButtons.forEach((b, k) => b.classList.toggle('active', PALETTE[k] === t));
}

function setBrush(n) {
  brush = clamp(n, 0, MAX_BRUSH);
  brushEl.value = brush;
  brushValEl.textContent = brush;
}

function togglePause() {
  paused = !paused;
  pauseEl.firstChild.textContent = paused ? 'Resume ' : 'Pause ';
  pauseEl.classList.toggle('active', paused);
}

brushEl.oninput = () => setBrush(+brushEl.value);
pauseEl.onclick = togglePause;
document.getElementById('clear').onclick = clearAll;

// ---------- input ----------

function updateCursor(e) {
  const rect = canvas.getBoundingClientRect();
  cursorX = clamp(Math.floor((e.clientX - rect.left) / rect.width * W), 0, W - 1);
  cursorY = clamp(Math.floor((e.clientY - rect.top) / rect.height * H), 0, H - 1);
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  updateCursor(e);
  pointerButton = e.button === 2 ? 2 : 0;
});
canvas.addEventListener('pointermove', updateCursor);
canvas.addEventListener('pointerup', e => {
  pointerButton = -1;
  if (e.pointerType !== 'mouse') cursorX = -1; // touch: hide brush after lifting
});
canvas.addEventListener('pointerleave', () => { if (pointerButton < 0) cursorX = -1; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  setBrush(brush + (e.deltaY < 0 ? 1 : -1));
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'p' || k === ' ') { togglePause(); e.preventDefault(); }
  else if (k === 'c') clearAll();
  else if (k === '+' || k === '=') setBrush(brush + 1);
  else if (k === '-' || k === '_') setBrush(brush - 1);
  else if (k >= '1' && k <= String(PALETTE.length)) select(PALETTE[+k - 1]);
});


// ---------- main loop ----------

let lastStats = 0, frames = 0;
function frame(now) {
  if (pointerButton === 0) paint(cursorX, cursorY, selected);
  else if (pointerButton === 2) paint(cursorX, cursorY, EMPTY);
  if (!paused) step();
  const count = render();

  frames++;
  if (now - lastStats > 500) {
    statsEl.textContent = `${count.toLocaleString()} particles · ${Math.round(frames * 1000 / (now - lastStats))} fps`;
    lastStats = now; frames = 0;
  }
  requestAnimationFrame(frame);
}

// size the grid from the canvas once layout is known, and whenever it changes
let seeded = false;
new ResizeObserver(() => {
  resize();
  if (!seeded && W > 40 && H > 40) { seeded = true; seed(); }
}).observe(canvas);
resize();
select(SAND);
setBrush(brush);
requestAnimationFrame(frame);
</script>
</body>
</html>
